name: Deploy KidsDictate to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 暫時移除 cache: 'npm'，因為目前還沒有 package-lock.json

      - name: Install Dependencies
        # 將 npm ci 改為 npm install，這樣沒有 lock 檔也能安裝
        run: npm install

      - name: Fetch Self-Hosted Tesseract Vendor Files (CSP Self-Contained)
        run: |
          mkdir -p vendor/tessdata
          curl -sL https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js -o vendor/tesseract.min.js
          curl -sL https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js -o vendor/worker.min.js
          curl -sL https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd.wasm.js -o vendor/tesseract-core-simd.wasm.js
          curl -sL https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js -o vendor/tesseract-core.wasm.js
          curl -sL https://tessdata.projectnaptha.com/4.0.0/chi_tra.traineddata.gz -o vendor/tessdata/chi_tra.traineddata.gz
          curl -sL https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o vendor/tessdata/eng.traineddata.gz

      - name: Build Project (TS & CSS)
        run: npm run build

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp -r index.html css js vendor dist/ 2>/dev/null || cp -r index.html css js dist/
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
