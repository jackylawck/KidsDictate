  <main class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-6 space-y-6 print:max-w-none print:p-0 print:shadow-none">
    
    <header class="text-center print:hidden">
      <!-- 品牌 Title -->
      <h1 id="appTitle" class="text-2xl font-black text-indigo-600 tracking-tight">
        童心默書 KidsDictate

      <p id="appSubtitle" class="text-xs text-slate-400 mt-1">

      </p>

      <!-- 隱私宣告 -->
      <details class="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm cursor-pointer group text-left">
        <summary class="font-bold text-slate-700 select-none focus-visible:outline-2 focus-visible:outline-indigo-500 focus-visible:outline-offset-2 rounded group-open:text-indigo-600">
          🔒 隱私與安全說明 (家長請看)
        </summary>
        <div class="mt-3 space-y-2 text-slate-600 text-xs leading-relaxed">
          <p>✅ <b>零資料上傳</b>：照片與詞表只在手機記憶體內處理，絕對不上傳伺服器。</p>
          <p>✅ <b>離線可用</b>：無追蹤碼、無廣告、不收集姓名或學校資料。</p>
          <p>✅ <b>開源可查</b>：原始碼完全公開透明，任何人皆可審計。</p>
        </div>
      </details>
    </header>
